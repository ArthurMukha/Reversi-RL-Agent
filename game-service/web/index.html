<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Реверси</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231d7a4c'/><path d='M16 4a12 12 0 0 0 0 24z' fill='%23f5f7fa'/><path d='M16 4a12 12 0 0 1 0 24z' fill='%231b1f24'/></svg>">
</head>
<body>

<main class="app">

  <header class="app__head">
    <h1 class="app__title">Реверси</h1>
    <p class="app__sub">Отелло 8×8 · два игрока за одной доской</p>
  </header>

  <section class="scores" aria-label="Счёт">
    <article class="player" id="player-white" data-side="white">
      <span class="player__disc"></span>
      <span class="player__meta">
        <span class="player__name">White</span>
        <span class="player__turn">ходит</span>
      </span>
      <span class="player__score" id="score-white">2</span>
    </article>

    <article class="player" id="player-black" data-side="black">
      <span class="player__disc"></span>
      <span class="player__meta">
        <span class="player__name">Black</span>
        <span class="player__turn">ходит</span>
      </span>
      <span class="player__score" id="score-black">2</span>
    </article>
  </section>

  <section class="board-area">
    <div class="ranks" id="ranks" aria-hidden="true"></div>

    <div class="board-wrap">
      <div class="board" id="board" data-turn="white" role="grid" aria-label="Игровая доска"></div>

      <div class="overlay" id="overlay" hidden>
        <div class="overlay__card">
          <p class="overlay__eyebrow">Партия окончена</p>
          <p class="overlay__result" id="overlay-result">—</p>
          <p class="overlay__score" id="overlay-score">—</p>
          <button class="btn btn--primary" id="overlay-again">Играть снова</button>
        </div>
      </div>
    </div>

    <div class="files" id="files" aria-hidden="true"></div>
  </section>

  <p class="status" id="status" role="status" aria-live="polite">Ход White</p>

  <footer class="app__foot">
    <button class="btn" id="new-game">Новая игра</button>
    <span class="hint">Кликни по подсвеченной клетке</span>
  </footer>

</main>

<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="app.js"></script>
</body>
</html>
