syntax = "proto3";
option go_package = "github.com/ArthurMukha/reversi-rl-agent/game-service/internal/pb;pb";
package model_service.v1;

// Контракт между игровым сервисом на Go и сервисом модели на Python.
//
// Правила игры живут ТОЛЬКО в Go. Модель их не знает: получает позицию
// и список легальных ходов, возвращает выбранный.
//
// Запрос не имеет состояния — каждый вызов несёт полную позицию. Поэтому
// сервис модели можно перезапустить посреди партии, и никто не заметит.
service ModelService {
    rpc SelectMove(SelectMoveRequest) returns(SelectMoveResponse);
}

// Значения совпадают с game.Cell в Go, но владеет ими контракт:
// Python не должен полагаться на то, что «там так же».
enum Cell {
    CELL_EMPTY = 0;
    CELL_WHITE = 1;
    CELL_BLACK = 2;
}

// Позиция на доске. Без настроек вызова — они уровнем выше.
message State {
    // Ровно 64 клетки, row-major: индекс = row * 8 + col.
    // Вложенный repeated в proto3 запрещён, поэтому массив плоский,
    // а длину приходится проверять на приёме руками.
    repeated Cell board = 1;

    // Чей ход. Из board не выводится, поэтому передаётся явно:
    // сеть ест не абсолютные цвета, а планы «мои фишки / чужие фишки».
    Cell current = 2;

    // Считает Go. Python принимает на веру и не выбирает за пределами списка.
    // Пустой список — ошибка запроса (INVALID_ARGUMENT), а не «пас»:
    // пасы обрабатывает Go, до модели такая позиция доходить не должна.
    repeated Move legal_moves = 3;
}

message SelectMoveRequest {
    State state = 1;

    // Какой моделью отвечать. Неизвестная — NOT_FOUND.
    string model_id = 2;

    // 0 — детерминированный выбор (argmax), больше — тем случайнее.
    // optional здесь обязателен: у proto3 дефолт float равен нулю, и без
    // явного отслеживания присутствия «клиент не передал» неотличимо от
    // «клиент передал 0». Иначе забытое поле молча включает argmax.
    optional float temperature = 3;
}

message Move {
    int32 row = 1;
    int32 col = 2;
}

message SelectMoveResponse {
    // Выбранный ход. Доску не применяем и фишки не переворачиваем —
    // это делает Go, правила его.
    Move move = 1;

    // Оценка позиции ОТ ЛИЦА state.current: +1 — выигрывает тот, чей ход.
    // Перспектива именно такая, потому что вход сети собран от него же.
    float value = 2;

    // Ровно 64 значения, тот же порядок, что у board.
    // Это распределение ПОСЛЕ маски: сумма равна 1, на нелегальных ходах нули.
    // Считается при температуре 1 независимо от temperature запроса —
    // policy означает «что думает сеть», а temperature только «как выбирали».
    repeated float policy = 3;

    // Какая модель реально ответила.
    string model_id = 4;
}
